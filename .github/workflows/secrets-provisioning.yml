# Lab 10: secret provisioning in CI with the decentralized approach (SOPS + age).
# Secrets live encrypted in the repo (secrets/*.enc.env). The CI age private key is the
# only thing stored in GitHub (secret SOPS_AGE_KEY); sops decrypts in memory and injects
# the values as environment variables into the process that needs them.
name: secrets-provisioning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SOPS_VERSION: "3.13.3"

jobs:
  sops-lint:
    name: Encrypted secrets are really encrypted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Only *.enc.env files are allowed in secrets/
        run: |
          bad=$(git ls-files secrets | grep -vE '^secrets/(README\.md|[A-Za-z0-9_-]+\.enc\.env)$' || true)
          if [ -n "$bad" ]; then echo "::error::unexpected files in secrets/: $bad"; exit 1; fi
      - name: Every value must be ENC[...] (prints key names only, never values)
        run: |
          shopt -s nullglob
          files=(secrets/*.enc.env)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no secrets/*.enc.env files found"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            grep -q '^sops_mac=ENC\[' "$f" || { echo "::error file=$f::not a SOPS-encrypted file"; status=1; }
            plain=$(grep -vE '^(#|$|sops_)' "$f" | grep -vE '^[A-Za-z_][A-Za-z0-9_]*=ENC\[AES256_GCM,' | cut -d= -f1 || true)
            if [ -n "$plain" ]; then echo "::error file=$f::plaintext value for: $plain"; status=1; fi
          done
          [ $status -eq 0 ] && echo "All ${#files[@]} files are fully encrypted"
          exit $status

  sops-provision:
    name: Decentralized provisioning (SOPS + age)
    needs: sops-lint
    runs-on: ubuntu-latest
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}   # masked in logs by GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Key not available (e.g. PR from a fork)
        if: env.SOPS_AGE_KEY == ''
        run: echo "::warning::SOPS_AGE_KEY is not set, decryption steps are skipped"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.SOPS_AGE_KEY != ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install sops (pinned version, sha256 verified)
        if: env.SOPS_AGE_KEY != ''
        run: |
          base="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
          bin="sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSLO "$base/$bin"
          curl -fsSLO "$base/sops-v${SOPS_VERSION}.checksums.txt"
          grep " ${bin}\$" "sops-v${SOPS_VERSION}.checksums.txt" | sha256sum --check
          sudo install -m 0755 "$bin" /usr/local/bin/sops
          sops --version
      - name: Install dependencies
        if: env.SOPS_AGE_KEY != ''
        run: pip install -r requirements.txt
      - name: Django deploy checks with secrets injected by sops (env provisioning)
        if: env.SOPS_AGE_KEY != ''
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: sops exec-env secrets/app.enc.env 'python manage.py check --deploy --fail-level WARNING'
      - name: Least privilege - CI key must NOT open infra secrets
        if: env.SOPS_AGE_KEY != ''
        run: |
          if sops decrypt secrets/infra.enc.env > /dev/null 2>&1; then
            echo "::error::the CI key can decrypt infra.enc.env, remove it from .sops.yaml"; exit 1
          fi
          echo "OK: CI identity is not a recipient of secrets/infra.enc.env"
