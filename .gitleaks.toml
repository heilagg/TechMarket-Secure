# Gitleaks configuration: default rules + project-specific rules.
title = "TechMarket gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "django-secret-key"
description = "Hardcoded Django SECRET_KEY"
regex = '''SECRET_KEY\s*=\s*['"]([^'"]{20,})['"]'''
secretGroup = 1
keywords = ["secret_key"]

[[rules]]
id = "django-insecure-key-literal"
description = "Django auto-generated insecure key"
regex = '''django-insecure-[a-z0-9!@#$%^&*(\-_=+)]{30,}'''
keywords = ["django-insecure-"]

[[rules]]
id = "keycloak-client-secret"
description = "Keycloak / OIDC client secret"
regex = '''(?i)(oidc_rp_client_secret|client_secret)\s*[=:]\s*['"]?([A-Za-z0-9]{24,})'''
secretGroup = 2
keywords = ["client_secret"]

[allowlist]
description = "Example and test files"
paths = ['''\.env\.example$''', '''semgrep-rules/.*''', '''baseline-.*\.txt$''']
# JDBC URL in infra/docker-compose.yml is a hostname, not a secret
regexes = ['''^\d+/keycloak$''']
